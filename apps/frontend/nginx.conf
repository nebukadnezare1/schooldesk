server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # API : toujours proxifiée vers le backend en interne — le navigateur ne parle jamais
    # directement au backend, jamais d'adresse backend dans le JavaScript envoyé au client
    # (voir CLAUDE.md §2/§9, architecture Cloudflare Tunnel -> Nginx -> backend). proxy_pass
    # sans chemin après "backend:3000" transmet l'URI d'origine telle quelle (/api/xxx reste
    # /api/xxx côté backend, qui monte déjà tous ses routeurs sous /api). Toutes les méthodes
    # HTTP (GET/POST/PUT/PATCH/DELETE) et le corps de la requête sont transmis sans modification.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # index.html ne doit jamais rester en cache longtemps, pour qu'un nouveau déploiement soit
    # pris en compte rapidement plutôt que de servir une ancienne version en cache.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fichiers compilés par Vite (nom de fichier avec hash de contenu, ex. index-abc123.js) :
    # mise en cache longue durée sûre, un nouveau déploiement change toujours le nom de fichier.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Routage côté client (React Router) : toute route inconnue du serveur retombe sur
    # index.html, qui décide lui-même de la page à afficher.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
