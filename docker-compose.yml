services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKEND_PORT: ${BACKEND_PORT}
      CORS_ORIGIN: ${CORS_ORIGIN}
      NODE_ENV: ${NODE_ENV}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - documents_data:/app/storage/documents
      - backups_data:/app/storage/backups
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:${BACKEND_PORT}/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Sauvegarde automatique quotidienne de la base PostgreSQL complète (toutes les écoles),
  # indépendante de l'export/restauration par école de la page Paramètres. Voir scripts/db-backup/.
  db-backup:
    build:
      context: .
      dockerfile: scripts/db-backup/Dockerfile
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      DB_BACKUP_DIR: /backups
      DB_BACKUP_RETENTION: ${DB_BACKUP_RETENTION:-14}
      DB_BACKUP_CHECK_INTERVAL: ${DB_BACKUP_CHECK_INTERVAL:-3600}
      TZ: ${DB_BACKUP_TZ:-UTC}
      # Copie hors NAS par e-mail (chiffrée), désactivée par défaut — voir scripts/db-backup/email.sh.
      # Réutilise le même serveur SMTP que le backend (variables SMTP_* ci-dessus).
      DB_BACKUP_EMAIL_ENABLED: ${DB_BACKUP_EMAIL_ENABLED:-false}
      DB_BACKUP_EMAIL_TO: ${DB_BACKUP_EMAIL_TO:-}
      DB_BACKUP_EMAIL_PASSPHRASE: ${DB_BACKUP_EMAIL_PASSPHRASE:-}
      DB_BACKUP_EMAIL_MAX_MB: ${DB_BACKUP_EMAIL_MAX_MB:-18}
      DB_BACKUP_EMAIL_MAX_ATTEMPTS: ${DB_BACKUP_EMAIL_MAX_ATTEMPTS:-3}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ${DB_BACKUP_HOST_DIR:-./storage/db-backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  documents_data:
  backups_data:

# Nom explicite plutôt que le nom auto-dérivé du dossier (qui change selon l'endroit où ce
# projet est déployé — ex. "ecole-garden" en local, un autre nom de dossier sur le NAS) : les
# autres projets (ex. l'app super-admin, docker-compose.yml séparé) qui doivent rejoindre ce
# réseau via "external: true" ont ainsi un nom fixe et prévisible, indépendant du dossier.
networks:
  default:
    name: ecole-garden-shared
